# Codemagic：在 macOS 机器上把本工具打成 Mac 可用的 .app / .dmg
# 用法：Codemagic 连接本 Gitee 仓库后，选 macos-build 工作流构建；产物在 Artifacts 里下载。
workflows:
  macos-build:
    name: SandClaimer macOS (.app + .dmg)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: "Sand Claimer"
    scripts:
      - name: 安装 Python 依赖（含 mac 的 pyobjc）
        script: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          # pywebview 在 mac 走 Cocoa/WebKit，需要 pyobjc
          python3 -m pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit pyobjc-framework-Quartz
      - name: 生成 .icns 图标
        script: |
          set -euo pipefail
          SRC="assets/icon-1024.png"
          if [ -f "$SRC" ]; then
            ICONSET="icon.iconset"; rm -rf "$ICONSET"; mkdir -p "$ICONSET"
            for s in 16 32 64 128 256 512; do
              sips -z $s $s     "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
              d=$((s*2)); sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns "$ICONSET" -o icon.icns
            echo "icon.icns 生成完成"
          else
            echo "没有 assets/icon-1024.png，跳过图标"
          fi
      - name: Nuitka 编译为 .app
        script: |
          set -euo pipefail
          VER="$(python3 -c 'import sand_patch; print(sand_patch.TOOL_VERSION)')"
          ICON_ARG=""
          [ -f icon.icns ] && ICON_ARG="--macos-app-icon=icon.icns"
          python3 -m nuitka --standalone --assume-yes-for-downloads \
            --static-libpython=no \
            --macos-create-app-bundle \
            --macos-app-name="Sand Claimer" \
            $ICON_ARG \
            --enable-plugin=pywebview \
            --include-data-dir=web=web \
            --company-name="SandClaimer" --product-name="Sand Claimer" \
            --product-version=$VER \
            --output-dir=build-mac \
            app.py
      - name: 打成 DMG
        script: |
          set -euo pipefail
          cd build-mac
          APP=$(ls -d *.app | head -n1)
          # ad-hoc 重签名，减少本机 Gatekeeper 拦截（正式分发需 Apple 开发者证书 + 公证）
          codesign --force --deep --sign - "$APP" || true
          hdiutil create -volname "SandClaimer" -srcfolder "$APP" -ov -format UDZO "SandClaimer.dmg"
    artifacts:
      - build-mac/*.dmg
      - build-mac/*.app
